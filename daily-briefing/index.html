<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily AI Brief — Logicbroker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --blue:#0066cc; --teal:#00a99d; --bg:#f5f7fa; --card:#fff; --text:#1a1a2e; --muted:#6b7280; --border:#e5e7eb; --red:#ef4444; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }

    header { background: linear-gradient(135deg, #0066cc 0%, #00a99d 100%); color: white; padding: 18px 20px 14px; text-align: center; }
    header .eyebrow { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; opacity: .8; margin-bottom: 3px; }
    header h1 { font-size: 1.35rem; font-weight: 700; }
    header .badge { display: inline-block; background: rgba(255,255,255,.22); border-radius: 20px; padding: 2px 10px; font-size: .8rem; font-weight: 600; margin-top: 5px; }

    .controls { background: #fff; border-bottom: 1px solid var(--border); padding: 8px 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; position: sticky; top: 0; z-index: 10; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    .btn { display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; font-size: .8rem; font-weight: 600; transition: all .15s; white-space: nowrap; }
    .btn-blue { background: var(--blue); color: #fff; } .btn-blue:hover { background: #0052a3; }
    .btn-teal { background: var(--teal); color: #fff; } .btn-teal:hover { background: #008c82; }
    .btn-red  { background: var(--red);  color: #fff; } .btn-red:hover  { background: #dc2626; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); } .btn-ghost:hover { background: var(--bg); color: var(--text); }
    .btn-voice-on { background: #7c3aed; color: #fff; } .btn-voice-on:hover { background: #6d28d9; }
    .listening-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--red); animation: pulse 1s infinite; margin-left: 4px; }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }
    .right-controls { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }
    .speed-wrap, .voice-wrap { display: flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--muted); }
    .speed-wrap input[type=range] { width: 80px; accent-color: var(--blue); }
    .speed-val { min-width: 28px; font-weight: 700; color: var(--text); }
    select.voice-sel { font-size: .78rem; border: 1px solid var(--border); border-radius: 5px; padding: 4px 6px; background: #fff; color: var(--text); max-width: 160px; }

    main { max-width: 700px; margin: 0 auto; padding: 14px 12px 48px; }
    .day-group { margin-bottom: 22px; }
    .day-hdr { font-size: .7rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 0 2px 7px; border-bottom: 1px solid var(--border); margin-bottom: 10px; display: flex; justify-content: space-between; }
    .article-card { background: var(--card); border-radius: 10px; border: 1px solid var(--border); margin-bottom: 9px; overflow: hidden; transition: border-color .2s, box-shadow .2s; }
    .article-card.playing { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(0,169,157,.15); }
    .card-top { display: flex; align-items: flex-start; gap: 10px; padding: 12px 12px 7px; }
    .card-meta { flex: 1; min-width: 0; }
    .art-title { font-size: .94rem; font-weight: 700; line-height: 1.4; margin-bottom: 3px; }
    .art-title a { color: var(--text); text-decoration: none; } .art-title a:hover { color: var(--blue); text-decoration: underline; }
    .art-byline { font-size: .76rem; color: var(--muted); }
    .card-actions { display: flex; flex-direction: column; gap: 5px; flex-shrink: 0; margin-top: 1px; }
    .play-btn { width: 33px; height: 33px; border-radius: 50%; border: none; background: var(--blue); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; transition: background .15s, transform .1s; }
    .play-btn:hover { background: #0052a3; transform: scale(1.06); } .play-btn.active { background: var(--teal); }
    .dismiss-btn { width: 33px; height: 33px; border-radius: 50%; border: 1px solid var(--border); background: #fff; color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: all .15s; }
    .dismiss-btn:hover { background: #fef2f2; color: var(--red); border-color: var(--red); }
    .card-body { padding: 0 12px 12px; }
    .art-summary { font-size: .86rem; color: #2d2d2d; line-height: 1.65; margin-bottom: 8px; }
    .tieback { background: #eef5ff; border-left: 3px solid var(--blue); padding: 7px 11px; border-radius: 0 6px 6px 0; }
    .tieback-label { font-size: .67rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--blue); margin-bottom: 2px; }
    .tieback-text { font-size: .8rem; color: #1a3660; line-height: 1.55; }

    .voice-prompt { background: #f3f0ff; border: 1px solid #c4b5fd; border-radius: 8px; padding: 10px 14px; margin: 10px 12px; font-size: .84rem; color: #4c1d95; display: flex; align-items: center; gap: 8px; }
    .voice-choices { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    .vchoice { padding: 5px 12px; border-radius: 5px; border: 1px solid #a78bfa; background: #fff; color: #5b21b6; font-size: .78rem; font-weight: 600; cursor: pointer; }
    .vchoice:hover { background: #ede9fe; }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-state .ck { font-size: 2.2rem; margin-bottom: 10px; }
    .empty-state h2 { font-size: 1rem; font-weight: 600; color: var(--text); margin-bottom: 5px; }
    .empty-state p { font-size: .86rem; }
    .loading { text-align: center; padding: 60px 20px; color: var(--muted); font-size: .88rem; }
    footer { text-align: center; padding: 12px; font-size: .76rem; color: var(--muted); border-top: 1px solid var(--border); }
    footer a { color: var(--blue); text-decoration: none; } footer a:hover { text-decoration: underline; }
    @media(max-width:480px){ .controls{padding:7px 10px;gap:6px} .right-controls{width:100%;margin-left:0} select.voice-sel{max-width:130px} main{padding:10px 9px 36px} }
  </style>
</head>
<body>
<header>
  <div class="eyebrow">Logicbroker Internal</div>
  <h1>Daily AI Brief</h1>
  <div class="badge" id="unread-badge">Loading...</div>
</header>

<div class="controls">
  <button class="btn btn-blue"  id="btn-read-all" onclick="readAll()">&#9654; Read All</button>
  <button class="btn btn-red"   id="btn-stop"     onclick="stopAll()" style="display:none">&#9632; Stop</button>
  <button class="btn btn-ghost" id="btn-mark-all" onclick="markAllRead()">&#10003; Mark all read</button>
  <button class="btn btn-ghost" id="btn-sort"     onclick="toggleSort()">&#8645; Oldest first</button>
  <button class="btn btn-ghost" id="btn-voice-mode" onclick="toggleVoiceMode()" title="Enables microphone so you can SPEAK 'Keep', 'Dismiss', or 'Open' instead of clicking the buttons. Read All always pauses and shows the prompt — this just adds voice input.">&#127908; Mic</button>
  <div class="right-controls">
    <div class="speed-wrap">
      <span>Speed</span>
      <input type="range" id="speed-slider" min="0.8" max="1.5" step="0.1" value="1.0" oninput="updateSpeed(this.value)">
      <span class="speed-val" id="speed-label">1.0x</span>
    </div>
    <div class="voice-wrap">
      <span>Voice</span>
      <select class="voice-sel" id="voice-sel" onchange="saveVoice(this.value)"><option value="">Default</option></select>
      <button class="btn btn-ghost" onclick="previewVoice()" title="Hear the selected voice before using it" style="padding:5px 10px;font-size:.76rem">&#9654; Test</button>
    </div>
  </div>
</div>

<main id="main"><div class="loading">Loading articles...</div></main>

<footer>Daily AI Brief &nbsp;|&nbsp; <a href="https://jasonckrug.github.io/logicbroker-tools/">All Internal Tools</a></footer>

<script>
const DK = 'lb_dismissed_v2';
const SK = 'lb_sort_v1';
const VK = 'lb_voice_uri_v1';
const VMK = 'lb_voicemode_v1';
const SPK = 'lb_speed_v1';

let archive = [], speed = 1.0, sortNewest = true, voiceModeOn = false;
let selectedVoice = null, voices = [];
let isSpeaking = false, isPaused = false, readQueue = [], readQueueIdx = 0, isReadAll = false, currentArticle = null;
let activeRecognition = null, listenSession = 0;
let currentCardUrl = null, pendingCallback = null;
let vcResolve = null; // for voice command promise

// --- LocalStorage helpers ---
function getDismissed() { try { return new Set(JSON.parse(localStorage.getItem(DK)||'[]')); } catch(e) { return new Set(); } }
function saveDismissed(s) { try { localStorage.setItem(DK, JSON.stringify([...s])); } catch(e) {} }
function ls(k,v) { if(v===undefined){ try{return localStorage.getItem(k);}catch(e){return null;} } try{localStorage.setItem(k,v);}catch(e){} }

// --- Init ---
function init() {
  speed = parseFloat(ls(SPK)||'1.0');
  document.getElementById('speed-slider').value = speed;
  document.getElementById('speed-label').textContent = speed.toFixed(1)+'x';

  sortNewest = (ls(SK)||'newest') === 'newest';
  updateSortBtn();

  voiceModeOn = ls(VMK) === 'on';
  updateVoiceModeBtn();

  loadVoices();
  loadArchive();
}

// --- Voices ---
function loadVoices() {
  const populate = () => {
    voices = speechSynthesis.getVoices().filter(v => v.lang.startsWith('en'));
    const sel = document.getElementById('voice-sel');
    sel.innerHTML = '<option value="">Default system voice</option>';
    voices.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v.voiceURI;
      opt.textContent = v.name + (v.localService ? '' : ' ☁');
      if (v.voiceURI === ls(VK)) opt.selected = true;
      sel.appendChild(opt);
    });
    const saved = ls(VK);
    if (saved) selectedVoice = voices.find(v => v.voiceURI === saved) || null;
  };
  if (speechSynthesis.getVoices().length) populate();
  speechSynthesis.onvoiceschanged = populate;
}
function saveVoice(uri) {
  ls(VK, uri);
  selectedVoice = voices.find(v => v.voiceURI === uri) || null;
}

// --- Speed ---
function updateSpeed(v) { speed = parseFloat(v); document.getElementById('speed-label').textContent = speed.toFixed(1)+'x'; ls(SPK, v); }

// --- Sort ---
function toggleSort() {
  sortNewest = !sortNewest;
  ls(SK, sortNewest ? 'newest' : 'oldest');
  updateSortBtn();
  renderArticles();
}
function updateSortBtn() {
  document.getElementById('btn-sort').textContent = (sortNewest ? '虅 Oldest first' : '虅 Newest first');
}

// --- Voice mode ---
function toggleVoiceMode() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR && !voiceModeOn) { alert('Voice commands are not supported in this browser. Try Chrome or Edge.'); return; }
  voiceModeOn = !voiceModeOn;
  ls(VMK, voiceModeOn ? 'on' : 'off');
  updateVoiceModeBtn();
}
function updateVoiceModeBtn() {
  const btn = document.getElementById('btn-voice-mode');
  if (voiceModeOn) { btn.className = 'btn btn-voice-on'; btn.textContent = '🎙 Mic ON'; }
  else { btn.className = 'btn btn-ghost'; btn.textContent = '🎙 Mic'; }
}

// --- Dismiss ---
function dismissArticle(url) {
  const d = getDismissed(); d.add(url); saveDismissed(d);
  const el = document.getElementById('card-'+urlId(url));
  if (el) { el.style.transition='opacity .25s,transform .25s'; el.style.opacity='0'; el.style.transform='translateX(18px)'; setTimeout(()=>{ el.remove(); refreshCounts(); }, 270); }
  if (currentCardUrl === url) stopAll();
}
function markAllRead() {
  const d = getDismissed();
  document.querySelectorAll('.article-card').forEach(c => { if(c.dataset.url) d.add(c.dataset.url); });
  saveDismissed(d); renderArticles();
}
function refreshCounts() {
  const n = document.querySelectorAll('.article-card').length;
  document.getElementById('unread-badge').textContent = n === 0 ? 'All caught up' : n + ' unread';
  document.querySelectorAll('.day-group').forEach(g => {
    const c = g.querySelectorAll('.article-card').length;
    if (!c) g.remove(); else g.querySelector('.day-count').textContent = c + (c===1?' article':' articles');
  });
}

// --- TTS core ---
function speakText(text, onEnd) {
  if (!window.speechSynthesis) { if(onEnd) onEnd(); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = speed;
  if (selectedVoice) u.voice = selectedVoice;
  u.onend = () => { isSpeaking = false; if(onEnd) onEnd(); };
  u.onerror = () => { isSpeaking = false; if(onEnd) onEnd(); };
  isSpeaking = true;
  window.speechSynthesis.speak(u);
}

function setCardPlaying(url, playing) {
  if (url) {
    const id = 'card-'+urlId(url);
    const card = document.getElementById(id);
    const btn  = document.getElementById('play-'+urlId(url));
    if (card) card.classList.toggle('playing', playing);
    if (btn)  { btn.classList.toggle('active', playing); btn.innerHTML = playing ? '&#9646;&#9646;' : '&#9654;'; }
  }
}

function resetUI() {
  isReadAll = false; readQueueIdx = 0; readQueue = []; isSpeaking = false; isPaused = false; currentArticle = null; abortActiveRecognition();
  if (currentCardUrl) setCardPlaying(currentCardUrl, false);
  currentCardUrl = null;
  document.getElementById('btn-stop').style.display = 'none';
  document.getElementById('btn-read-all').style.display = 'inline-flex';
  removeVoicePrompt();
  if (vcResolve) { vcResolve('keep'); vcResolve = null; }
  window.speechSynthesis && window.speechSynthesis.cancel();
}

function stopAll() { resetUI(); }

// --- Article TTS ---
function articleText(a) {
  return `${a.title}. From ${a.publisher}. ${a.summary} Logicbroker angle: ${a.tieback}`;
}

async function readArticle(a, afterFn) {
  if (currentCardUrl) setCardPlaying(currentCardUrl, false);
  currentCardUrl = a.url; currentArticle = a;
  setCardPlaying(a.url, true);
  document.getElementById('btn-stop').style.display = 'inline-flex';

  if (isReadAll || voiceModeOn) {
    // Show prompt NOW — user can click Keep/Dismiss/Open to skip while article is reading
    const cmdPromise = showVoicePrompt(a, false, null);

    let speechEnded = false;
    speakText(articleText(a), () => {
      speechEnded = true;
      setCardPlaying(a.url, false);
      // Speech finished naturally — if Mic ON and user hasn't chosen yet, speak cue then listen
      if (voiceModeOn && vcResolve) {
        // No spoken cue — TTS would be picked up by mic and trigger false commands
        // Show visual status instead, then start listening after a clear gap
        const statusEl = document.getElementById('vc-listen-status');
        if (statusEl) statusEl.innerHTML = 'Mic ready<span class="listening-dot"></span>';
        setTimeout(() => startListening(document.getElementById('vc-listen-status')), 900);
      }
    });

    const cmd = await cmdPromise;

    // User chose — cancel speech if it's still going (they skipped ahead)
    if (!speechEnded) {
      window.speechSynthesis.cancel();
      isSpeaking = false; isPaused = false; currentArticle = null; abortActiveRecognition();
      setCardPlaying(a.url, false);
    }
    currentCardUrl = null;
    removeVoicePrompt();

    if (cmd === 'dismiss') {
      dismissArticle(a.url);
      if (isReadAll) advanceQueue(); else resetUI();
    } else if (cmd === 'open') {
      openAndRead(a, afterFn);
    } else {
      if (isReadAll) advanceQueue(); else resetUI();
    }
  } else {
    speakText(articleText(a), () => {
      setCardPlaying(a.url, false);
      currentCardUrl = null;
      if (afterFn) afterFn(); else resetUI();
    });
  }
}

// --- Voice command flow ---
function removeVoicePrompt() { const el = document.getElementById('vc-prompt'); if(el) el.remove(); }

function showVoicePrompt(article, isPostArticle, onChoice) {
  removeVoicePrompt();
  const div = document.createElement('div');
  div.id = 'vc-prompt'; div.className = 'voice-prompt';
  div.innerHTML = `<div>
    <div style="font-weight:700;margin-bottom:4px">${voiceModeOn ? '&#127908; ' : ''}${isPostArticle ? 'Full article read.' : (voiceModeOn ? 'Say or click to skip:' : 'Skip ahead or keep listening:')}</div>
    <div class="voice-choices">
      <button class="vchoice" onclick="resolveVC('keep')">Keep / Next</button>
      <button class="vchoice" onclick="resolveVC('dismiss')">Dismiss</button>
      <button class="vchoice" onclick="resolveVC('open')">${isPostArticle ? 'Open in browser' : 'Open Article'}</button>
      ${!isPostArticle ? '<button class="vchoice" onclick="replayCurrentArticle()">&#8635; Replay</button>' : ''}
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
      <div id="vc-listen-status" style="font-size:.76rem;color:#7c3aed;flex:1"></div>
      <button onclick="testMic()" style="font-size:.72rem;padding:3px 8px;border-radius:4px;border:1px solid #a78bfa;background:#fff;color:#5b21b6;cursor:pointer" title="Check if microphone is working">&#127908; Test mic</button>
    </div>
  </div>`;
  const cardId = 'card-'+urlId(article.url);
  const card = document.getElementById(cardId);
  if (card) card.after(div); else document.getElementById('main').prepend(div);
  setTimeout(() => div.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
  return new Promise(resolve => { vcResolve = resolve; });
}

function resolveVC(cmd) { if (vcResolve) { vcResolve(cmd); vcResolve = null; } }

function abortActiveRecognition() {
  if (activeRecognition) { try { activeRecognition.abort(); } catch(e) {} activeRecognition = null; }
}

function startListening(statusEl) {
  abortActiveRecognition(); // Kill any previous session before starting
  if (window.speechSynthesis && window.speechSynthesis.speaking) {
    setTimeout(() => startListening(statusEl), 400);
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;

  listenSession++;
  const mySession = listenSession;
  const r = new SR();
  activeRecognition = r;
  r.lang='en-US'; r.maxAlternatives=3; r.interimResults=false;
  let timer = setTimeout(() => { try{r.abort();}catch(e){} }, 8000);
  if (statusEl) { statusEl.innerHTML = 'Listening<span class="listening-dot"></span>'; }
  r.onresult = (e) => {
    clearTimeout(timer); activeRecognition = null;
    if (listenSession !== mySession) return; // Stale session — ignore
    const t = Array.from(e.results[0]).map(x=>x.transcript).join(' ').toLowerCase();
    if (statusEl) statusEl.textContent = 'Heard: "' + t + '"';
    if (t.includes('dismiss') || t.includes('hide') || t.includes('remove')) resolveVC('dismiss');
    else if (t.includes('open article') || t.includes('open')) resolveVC('open');
    else if (t.includes('replay') || t.includes('again') || t.includes('repeat')) { replayCurrentArticle(); }
    else resolveVC('keep');
  };
  r.onerror = () => {
    clearTimeout(timer); activeRecognition = null;
    if (listenSession !== mySession) return; // Stale session — ignore
    if (statusEl) statusEl.textContent = 'Not heard — click a button to continue';
    // No auto-advance: stale delayed resolveVC was causing next article to skip automatically
  };
  r.onend = () => { clearTimeout(timer); if (activeRecognition === r) activeRecognition = null; };
  try { r.start(); } catch(e) {}
}

async function promptVoiceCommand(article, afterFn, isPostArticle) {
  // No spoken cue — mic would hear itself through speakers and misfire
  const promptEl = showVoicePrompt(article, isPostArticle, null);
  if (voiceModeOn) {
    const statusEl = document.getElementById('vc-listen-status');
    if (statusEl) statusEl.innerHTML = 'Mic ready<span class="listening-dot"></span>';
    setTimeout(() => startListening(document.getElementById('vc-listen-status')), 900);
  }
  const cmd = await promptEl;
  removeVoicePrompt();
  if (!isReadAll && cmd !== 'keep') {} // single-article mode — just act
  if (cmd === 'dismiss') {
    dismissArticle(article.url);
    if (isReadAll) advanceQueue(); else resetUI();
  } else if (cmd === 'open') {
    if (isPostArticle) { window.open(article.url, '_blank'); if(isReadAll) advanceQueue(); else resetUI(); }
    else openAndRead(article, afterFn);
  } else {
    if (afterFn) afterFn(); else resetUI();
  }
}

async function openAndRead(article, afterFn) {
  speakText('Fetching full article. One moment.', null);
  try {
    const res = await Promise.race([
      fetch('https://api.allorigins.win/get?url=' + encodeURIComponent(article.url)),
      new Promise((_,rej) => setTimeout(()=>rej(new Error('timeout')), 12000))
    ]);
    if (!res.ok) throw new Error('fetch failed');
    const data = await res.json();
    const text = extractText(data.contents || '');
    if (text.length < 100) throw new Error('too short');
    speakText('Reading full article: ' + article.title + '. ' + text, () => {
      promptVoiceCommand(article, afterFn, true);
    });
  } catch(e) {
    // Show visible error in the prompt area
    const errEl = document.getElementById('vc-listen-status');
    if (errEl) errEl.innerHTML = '<span style="color:#dc2626">&#9888; Article content not accessible (paywall or JS-only site). Opened in new tab.</span>';
    window.open(article.url, '_blank');
    speakText('Article not accessible. Opened in your browser.', () => {
      setTimeout(() => { if (isReadAll) advanceQueue(); else resetUI(); }, 1500);
    });
  }
}

function extractText(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  ['script','style','nav','header','footer','aside','[class*="ad-"],[id*="ad-"],[class*="banner"],[class*="sidebar"],[class*="newsletter"]'].forEach(sel => {
    try { doc.querySelectorAll(sel).forEach(el=>el.remove()); } catch(e) {}
  });
  const content = doc.querySelector('article') || doc.querySelector('[role="main"]') || doc.querySelector('main') || doc.body;
  return (content ? content.textContent : '').replace(/\s+/g,' ').trim().substring(0,7000);
}

// --- Read All queue ---
function buildQueue() {
  const dismissed = getDismissed();
  const ordered = sortNewest ? [...archive] : [...archive].reverse();
  const q = [];
  ordered.forEach(day => day.articles.forEach(a => { if (!dismissed.has(a.url)) q.push(a); }));
  return q;
}

function readAll() {
  readQueue = buildQueue();
  if (!readQueue.length) return;
  isReadAll = true; readQueueIdx = 0;
  document.getElementById('btn-read-all').style.display = 'none';
  advanceQueue();
}

function advanceQueue() {
  if (!isReadAll || readQueueIdx >= readQueue.length) { resetUI(); return; }
  const a = readQueue[readQueueIdx++];
  readArticle(a, () => advanceQueue());
}

// --- Single article toggle ---
function toggleArticle(url) {
  const a = findArticle(url);
  if (!a) return;
  if (currentCardUrl === url) {
    if (isPaused) {
      // Resume paused article
      window.speechSynthesis.resume();
      isPaused = false;
      setCardPlaying(url, true);
      return;
    }
    if (isSpeaking || window.speechSynthesis.speaking) {
      // Pause currently playing article
      window.speechSynthesis.pause();
      isPaused = true;
      const id = urlId(url);
      const btn = document.getElementById('play-'+id);
      if (btn) { btn.classList.remove('active'); btn.innerHTML = '&#9654;'; }
      return;
    }
  }
  stopAll();
  isReadAll = false;
  document.getElementById('btn-read-all').style.display = 'inline-flex';
  readArticle(a, null);
}
function findArticle(url) {
  for (const day of archive) { const a = day.articles.find(x=>x.url===url); if(a) return a; }
  return null;
}

// --- Render ---
function renderArticles() {
  const main = document.getElementById('main');
  const dismissed = getDismissed();
  const ordered = sortNewest ? [...archive] : [...archive].reverse();
  let total = 0, html = '';
  ordered.forEach(day => {
    const unread = day.articles.filter(a => !dismissed.has(a.url));
    if (!unread.length) return;
    total += unread.length;
    html += `<div class="day-group"><div class="day-hdr"><span>${esc(day.date)}</span><span class="day-count">${unread.length} article${unread.length!==1?'s':''}</span></div>`;
    unread.forEach(a => {
      const id = urlId(a.url);
      const byline = [a.publisher, a.author, a.date].filter(Boolean).join(' \xB7 ');
      html += `<div class="article-card" id="card-${id}" data-url="${esc(a.url)}">
        <div class="card-top">
          <div class="card-meta">
            <div class="art-title"><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
            <div class="art-byline">${byline}</div>
          </div>
          <div class="card-actions">
            <button class="play-btn" id="play-${id}" data-url="${esc(a.url)}" onclick="handlePlay(this)" title="Read aloud">&#9654;</button>
            <button class="dismiss-btn" data-url="${esc(a.url)}" onclick="handleDismiss(this)" title="Dismiss">&times;</button>
          </div>
        </div>
        <div class="card-body">
          <div class="art-summary">${esc(a.summary)}</div>
          <div class="tieback"><div class="tieback-label">Logicbroker Tie-back</div><div class="tieback-text">${esc(a.tieback)}</div></div>
        </div>
      </div>`;
    });
    html += '</div>';
  });
  if (!total) html = `<div class="empty-state"><div class="ck">&#10003;</div><h2>All caught up</h2><p>New articles will appear here after the next morning digest.</p></div>`;
  main.innerHTML = html;
  document.getElementById('unread-badge').textContent = total === 0 ? 'All caught up' : total + ' unread';
}

function esc(s) { return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : ''; }

async function loadArchive() {
  try {
    const res = await fetch('./archive.json?v='+Date.now());
    if (!res.ok) throw new Error('HTTP '+res.status);
    archive = await res.json();
    renderArticles();
  } catch(e) {
    document.getElementById('main').innerHTML = `<div class="loading" style="color:var(--red)">Could not load articles. (${e.message})</div>`;
    document.getElementById('unread-badge').textContent = 'Error';
  }
}



// --- Stable URL -> element ID (avoids btoa throwing on some chars) ---
function urlId(url) {
  let h = 5381;
  for (let i = 0; i < url.length; i++) h = ((h << 5) + h) ^ url.charCodeAt(i);
  return 'u' + (h >>> 0).toString(36);
}

// --- Data-attribute click handlers (avoids inline JSON.stringify breaking HTML) ---
function handlePlay(btn) { toggleArticle(btn.dataset.url); }
function handleDismiss(btn) { dismissArticle(btn.dataset.url); }



// --- Replay current article ---
function replayCurrentArticle() {
  if (!currentArticle) return;
  window.speechSynthesis.cancel();
  isSpeaking = false; isPaused = false;
  // Re-read without resolving the prompt — buttons stay visible
  speakText(articleText(currentArticle), () => {
    if (voiceModeOn && vcResolve) {
      const statusEl2 = document.getElementById('vc-listen-status');
      if (statusEl2) statusEl2.innerHTML = 'Mic ready<span class="listening-dot"></span>';
      setTimeout(() => startListening(document.getElementById('vc-listen-status')), 900);
    }
  });
}

// --- Mic test (from voice prompt) ---
function testMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('Speech recognition not supported in this browser. Use Chrome or Edge.'); return; }
  const statusEl = document.getElementById('vc-listen-status');
  if (statusEl) statusEl.innerHTML = 'Testing mic<span class="listening-dot"></span>';
  const r = new SR(); r.lang = 'en-US'; r.maxAlternatives = 1;
  const timer = setTimeout(() => { try { r.abort(); } catch(e) {} if (statusEl) statusEl.textContent = 'No speech heard. Check mic permissions in browser settings.'; }, 6000);
  r.onresult = (e) => {
    clearTimeout(timer);
    const t = e.results[0][0].transcript;
    if (statusEl) statusEl.innerHTML = '&#10003; Mic working — heard: "' + t + '"';
  };
  r.onerror = (e) => {
    clearTimeout(timer);
    if (statusEl) statusEl.textContent = 'Mic error: ' + (e.error || 'check browser permissions');
  };
  try { r.start(); } catch(e) { if (statusEl) statusEl.textContent = 'Could not start mic: ' + e.message; }
}

// --- Voice preview ---
function previewVoice() {
  const uri = document.getElementById('voice-sel').value;
  const voice = voices.find(v => v.voiceURI === uri) || null;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(
    "Hello. This is a preview of the selected voice. You can use it to read your daily Logicbroker AI Brief."
  );
  u.rate = speed;
  if (voice) u.voice = voice;
  window.speechSynthesis.speak(u);
}

init();
